<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>Telegram Web</title>
    <meta name="description" content="Статический демонстрационный макет Telegram Web без авторизации.">
    <link rel="stylesheet" href="/static/telegram/telegram-auth-static.css">
</head>
<body>
    <main class="auth-page">
        <button class="theme-button" type="button" disabled aria-label="Theme switching is disabled">
            <span aria-hidden="true">&#9790;</span>
        </button>

        <section class="auth-card" aria-labelledby="auth-title">
            <div class="intro">
                <div class="qr-container">
                    <div id="qrcode"></div>
                    <div class="qr-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.98-6.16c.73-.27 1.39.18 1.11 1.31l-2.72 12.81c-.19.91-.74 1.13-1.5.71l-4.14-3.05-2 1.93c-.22.22-.41.4-.79.4z"/>
                        </svg>
                    </div>
                </div>
                <h1 id="auth-title">Log in by QR Code</h1>
                <p class="subtitle" id="auth-subtitle">Scan with Telegram app on your phone</p>
            </div>

            <ol class="steps">
                <li>
                    <span class="step-number">1</span>
                    <span id="step-1-text">Open Telegram on your phone</span>
                </li>
                <li>
                    <span class="step-number">2</span>
                    <span><span id="step-2-prefix">Go to</span> <strong id="settings-text">Settings</strong> <span class="chevron">&rsaquo;</span> <strong id="devices-text">Devices</strong> <span class="chevron">&rsaquo;</span> <strong id="add-device-text">Add Device</strong></span>
                </li>
                <li>
                    <span class="step-number">3</span>
                    <span id="step-3-text">Point your phone at this screen to confirm login</span>
                </li>
            </ol>

            <a class="text-button" href="https://web.telegram.org/k/">
                <span id="phone-action">LOG IN BY PHONE NUMBER</span> <span aria-hidden="true">&rsaquo;</span>
            </a>
            <button class="text-button" id="language-toggle" type="button" aria-pressed="false">
                &#1055;&#1056;&#1054;&#1044;&#1054;&#1051;&#1046;&#1048;&#1058;&#1068; &#1053;&#1040; &#1056;&#1059;&#1057;&#1057;&#1050;&#1054;&#1052;
            </button>
            <a class="text-button" href="https://web.telegram.org/k/">
                <span id="passkey-action">LOG IN BY PASSKEY</span> <span aria-hidden="true">&rsaquo;</span>
            </a>
        </section>

        <p class="static-note" id="static-note">QR IS DISABLED: SIGN-IN OPENS OFFICIAL TELEGRAM</p>
    </main>

    <script>
        const translations = {
            en: {
                title: "Log in by QR Code",
                subtitle: "Scan with Telegram app on your phone",
                step1: "Open Telegram on your phone",
                step2Prefix: "Go to",
                settings: "Settings",
                devices: "Devices",
                addDevice: "Add Device",
                step3: "Point your phone at this screen to confirm login",
                phone: "LOG IN BY PHONE NUMBER",
                language: "\u041f\u0420\u041e\u0414\u041e\u041b\u0416\u0418\u0422\u042c \u041d\u0410 \u0420\u0423\u0421\u0421\u041a\u041e\u041c",
                passkey: "LOG IN BY PASSKEY",
                note: "QR IS DISABLED: SIGN-IN OPENS OFFICIAL TELEGRAM"
            },
            ru: {
                title: "\u0412\u0445\u043e\u0434 \u043f\u043e QR-\u043a\u043e\u0434\u0443",
                subtitle: "\u041e\u0442\u0441\u043a\u0430\u043d\u0438\u0440\u0443\u0439\u0442\u0435 \u043a\u043e\u0434 \u0432 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0438 Telegram",
                step1: "\u041e\u0442\u043a\u0440\u043e\u0439\u0442\u0435 Telegram \u043d\u0430 \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0435",
                step2Prefix: "\u041f\u0435\u0440\u0435\u0439\u0434\u0438\u0442\u0435 \u0432",
                settings: "\u041d\u0430\u0441\u0442\u0440\u043e\u0439\u043a\u0438",
                devices: "\u0423\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0430",
                addDevice: "\u041f\u043e\u0434\u043a\u043b\u044e\u0447\u0438\u0442\u044c \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u043e",
                step3: "\u041d\u0430\u0432\u0435\u0434\u0438\u0442\u0435 \u043a\u0430\u043c\u0435\u0440\u0443 \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0430 \u043d\u0430 \u044d\u0442\u043e\u0442 \u044d\u043a\u0440\u0430\u043d",
                phone: "\u0412\u0425\u041e\u0414 \u041f\u041e \u041d\u041e\u041c\u0415\u0420\u0423 \u0422\u0415\u041b\u0415\u0424\u041e\u041d\u0410",
                language: "CONTINUE IN ENGLISH",
                passkey: "\u0412\u041e\u0419\u0422\u0418 \u041f\u041e \u041a\u041b\u042e\u0427\u0423 \u0414\u041e\u0421\u0422\u0423\u041f\u0410",
                note: "QR-\u041a\u041e\u0414 \u041e\u0422\u041a\u041b\u042e\u0427\u0415\u041d: \u0412\u0425\u041e\u0414 \u041e\u0422\u041a\u0420\u041e\u0415\u0422 \u041e\u0424\u0418\u0426\u0418\u0410\u041b\u042c\u041d\u042b\u0419 TELEGRAM"
            }
        };

        const languageToggle = document.querySelector("#language-toggle");
        let currentLanguage = "en";

        const renderLanguage = (language) => {
            const text = translations[language];

            document.documentElement.lang = language;
            document.querySelector("#auth-title").textContent = text.title;
            document.querySelector("#auth-subtitle").textContent = text.subtitle;
            document.querySelector("#step-1-text").textContent = text.step1;
            document.querySelector("#step-2-prefix").textContent = text.step2Prefix;
            document.querySelector("#settings-text").textContent = text.settings;
            document.querySelector("#devices-text").textContent = text.devices;
            document.querySelector("#add-device-text").textContent = text.addDevice;
            document.querySelector("#step-3-text").textContent = text.step3;
            document.querySelector("#phone-action").textContent = text.phone;
            document.querySelector("#passkey-action").textContent = text.passkey;
            document.querySelector("#static-note").textContent = text.note;
            languageToggle.textContent = text.language;
            languageToggle.setAttribute("aria-pressed", String(language === "ru"));
        };

        languageToggle.addEventListener("click", () => {
            currentLanguage = currentLanguage === "en" ? "ru" : "en";
            renderLanguage(currentLanguage);
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const qr = new QRCode(
            document.getElementById("qrcode"),
            {
                width: 208,
                height: 208,
                correctLevel: QRCode.CorrectLevel.H
            }
        );

        function updateQR() {
            qr.clear();
            qr.makeCode("DEMO-" + crypto.randomUUID());
        }

        updateQR();
        setInterval(updateQR, 30000);
    </script>
</body>
</html>
